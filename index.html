<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BalanceBoard</title>
<style>
:root{--bg:#eef4fb;--cd:#fff;--tx:#12345a;--mu:#6d829d;--ln:#e1eaf4;--sb:#0a1f45;--ac:#2e7cf6;--ac2:#5e59f7;--ok:#17c3a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--cd:#142340;--tx:#e8f0fc;--mu:#93a8c6;--ln:#24365a;--sb:#060f22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1426;--cd:#142340;--tx:#e8f0fc;--mu:#93a8c6;--ln:#24365a;--sb:#060f22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sb{background:var(--sb);color:#cfe0ff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:800;font-size:22px;color:#fff;margin:0 6px 18px}
.nv button{display:flex;gap:10px;width:100%;border:0;background:none;color:inherit;padding:12px 14px;border-radius:14px;font:inherit;cursor:pointer;margin:3px 0;text-align:left}
.nv button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
.mn{padding:18px 22px;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:22px;flex:1;min-width:170px}
h2{font-size:17px;margin:0 0 10px}
.pill{border:0;border-radius:22px;padding:9px 16px;font:inherit;font-weight:600;color:#fff;background:#6b7a90;cursor:pointer}
.pill.live{background:var(--ok)}.pill.demo{background:#e08a1e}
select,input{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:9px 12px}
.cd{background:var(--cd);border-radius:20px;padding:16px;box-shadow:0 6px 22px rgba(10,30,70,.08)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.mu{color:var(--mu);font-size:13px}
.ring{width:150px;height:150px;border-radius:50%;margin:6px auto;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center;position:relative}
.ring:after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--cd)}
.ring div{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--mu)}.ring b{display:block;font-size:38px;color:var(--tx)}
.ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:10px 0}
.m{background:var(--bg);border-radius:14px;padding:10px}.m span{font-size:12px;color:var(--mu)}.m b{display:block;font-size:18px}
.gc{border-radius:18px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.gc.adhd{background:#fde4ec;color:#7a1f3d}.gc.cp{background:#ece6ff;color:#3d2a8a}
.gc h3{margin:0;font-size:17px}.gc .ic{font-size:30px}.gc small{opacity:.8}
.scene{position:relative;aspect-ratio:4/3;max-height:60vh;margin:0 auto;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#8fe0ff,#3aa0d8 55%,#2c7a4b 56%,#3e9a5c)}
.tg{position:absolute;border:4px solid #ffe46b;border-radius:50%;aspect-ratio:1;transform:translate(-50%,-50%);box-shadow:0 0 24px #ffe46b;display:grid;place-items:center;color:#fff}
.bl{position:absolute;width:7%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:10px}
.bars i{flex:1;background:linear-gradient(180deg,var(--ac),var(--ok));border-radius:6px 6px 0 0;min-height:3px}
.bd{display:inline-block;padding:8px 12px;border-radius:14px;background:var(--bg);margin:4px;opacity:.45}.bd.on{opacity:1;background:#fff4c9;color:#7a5a00}
.chat{display:flex;flex-direction:column;gap:8px;height:48vh;overflow:auto;margin-bottom:10px}
.b{padding:9px 13px;border-radius:16px;max-width:82%;white-space:pre-wrap;background:var(--bg)}.b.u{align-self:flex-end;background:var(--ac);color:#fff}
.sendrow{display:flex;gap:8px}.sendrow input{flex:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
section{display:none}section.on{display:block}
@media(max-width:900px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;display:block;padding:10px}.logo{display:none}.nv{display:flex;gap:4px;overflow-x:auto}.nv button{width:auto;white-space:nowrap}.g2{grid-template-columns:1fr}.mn{padding:14px}}

.sb{background:linear-gradient(180deg,#0b2457,#061534);display:flex;flex-direction:column}
.logo{display:flex;gap:10px;align-items:center;font-size:19px;line-height:1.1}.logo img{width:40px;height:38px;object-fit:contain}.logo small{display:block;font-weight:500;font-size:10px;color:#9cc5ff;margin-top:3px}
.mc{margin-top:auto;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border-radius:16px;padding:10px;font-size:12px;color:#d6e6ff}.mc img{width:56px}
.av{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#d9efff}
.cd{border-radius:22px}
.ban{display:flex;justify-content:space-between;align-items:flex-end;min-height:180px;border-radius:18px;padding:16px 20px 0;margin-bottom:14px;color:#fff;background-size:cover;background-position:center}
.ban h2{font-size:24px;text-shadow:0 2px 8px rgba(0,0,0,.5);align-self:flex-start}.ban img{height:170px;object-fit:contain}
.gc{position:relative;min-height:170px;justify-content:flex-end;background-size:cover;background-position:center;color:#fff}
.gc.adhd,.gc.cp{color:#fff}.gc .ic{display:none}
.gc small{position:absolute;top:12px;left:12px;border-radius:12px;padding:3px 10px;font-weight:700;background:#ff5f93;opacity:1}.gc.cp small{background:#7b5cf0}
.gc h3{font-size:19px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.gc b{align-self:flex-start;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:20px;padding:7px 14px}
.scene{aspect-ratio:1/1;width:min(100%,64vh);max-height:none;background-size:cover;background-position:center}
.ch{position:absolute;left:50%;bottom:1%;width:15%;transform:translateX(-50%);pointer-events:none}
.gt{font-size:17px;margin-right:6px}
.hint{display:flex;align-items:center;gap:12px;margin:12px auto 0;width:min(100%,64vh);background:var(--bg);border-radius:14px;padding:10px 14px;font-weight:600}
.hint i{flex:1;height:10px;border-radius:6px;background:var(--ln);overflow:hidden}.hint u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--ac));text-decoration:none}
.tg{background:rgba(255,228,107,.18)}.bl{z-index:2;background:radial-gradient(circle at 35% 30%,#fff,#9be8ff)}
@media(max-width:900px){.sb{display:block}.mc{display:none}.logo{display:none}.ban img{height:130px}}
html body *{font-weight:700!important}html body h1,html body h2,html body h3,html body .ring b,html body .logo span{font-weight:800!important}
</style></head><body>
<div class="app"><aside class="sb"><div class="logo"><img data-img="logo" alt=""><span>BalanceBoard<small data-i18n="bio"></small></span></div><nav class="nv" id="nv"></nav><div class="mc"><img data-img="mascot" alt=""><b data-i18n="slogan"></b></div></aside>
<main class="mn">
<div class="top"><img class="av" data-img="boy" alt=""><div style="flex:1;min-width:170px"><h1 id="hi"></h1><div class="mu" data-i18n="topsub"></div></div>
<select id="lg"><option value="kk">Қазақша</option><option value="ru">Русский</option><option value="en">English</option></select>
<button class="pill demo" id="dv"></button></div>

<section id="v-home"><div class="g2">
<div class="cd"><div class="ban" id="bn"><h2 data-i18n="choose"></h2><img data-img="boy" alt=""></div><div class="g3" id="hg"></div><h2 data-i18n="last" style="margin-top:18px"></h2><div id="hl"></div></div>
<div class="cd"><h2 data-i18n="score"></h2><div class="ring" id="rg"><div><b data-k="sc">0</b>/100</div></div><div class="ms" id="m1"></div>
<button class="pill live" id="zr" style="width:100%" data-i18n="zero"></button><p class="mu" data-i18n="zh"></p></div></div></section>

<section id="v-games"><div class="cd"><div style="margin-bottom:12px"><span data-i18n="lvl"></span>: <select id="lv"><option>1</option><option>2</option><option>3</option></select></div><div class="g3" id="gg"></div></div></section>

<section id="v-play"><div class="cd"><div class="top"><b class="gt" id="gt"></b><span class="pill" id="ps"></span><span class="pill" id="pt"></span><span class="pill" id="pk"></span><button class="pill live" id="pf" data-i18n="fin" style="margin-left:auto"></button></div>
<div class="scene" id="sn"><div class="tg" id="tg">★</div><img class="ch" id="ch2" alt=""><div class="bl" id="bl"></div></div><div class="hint"><span data-i18n="hint"></span><i><u id="hb"></u></i></div><div class="ms" id="m2"></div></div></section>

<section id="v-results"><div class="cd"><div class="ms" id="rs"></div><div class="bars" id="rb"></div></div></section>

<section id="v-profile"><div class="cd"><p><span data-i18n="nm"></span><br><input id="pn"></p>
<p><span data-i18n="grp"></span><br><select id="pg"><option value="adhd" data-i18n="adhd"></option><option value="cp" data-i18n="cp"></option></select></p>
<h2 data-i18n="ach"></h2><div id="ab"></div></div></section>

<section id="v-journal"><div class="cd tw" id="jt"></div></section>

<section id="v-news"><div class="g3" id="nw"></div></section>

<section id="v-ai"><div class="cd"><div class="chat" id="ch"></div>
<div class="sendrow"><input id="aq" data-ph="aiph"><button class="pill live" id="as" data-i18n="send"></button></div></div></section>
</main></div>

ru:{home:'Главная',games:'Игры',results:'Результаты',profile:'Профиль',journal:'Журнал',news:'Новости',ai:'Помощник',guest:'Ученик',hello:'Привет, {n}!',conn:'Подключить плату',live:'Плата подключена',demo:'Демо-режим · нажмите, чтобы подключить',zero:'Задать ноль',zh:'Положите плату ровно и неподвижно, затем нажмите «Задать ноль».',score:'Balance Score',roll:'Крен (roll)',pitch:'Тангаж (pitch)',omega:'ω ср.',hold:'Время удержания',err:'Выходы',time:'Время',lvl:'Уровень',adhd:'СДВГ',cp:'ДЦП',g1:'Звёздное внимание',g2:'Космокурьер',g3:'Тихое озеро',g4:'Горная тропа',play:'Начать',fin:'Завершить',last:'Последние результаты',best:'Лучший',avg:'Средний',cnt:'Сессий',empty:'Сессий пока нет',date:'Дата',nm:'Имя',grp:'Направление',ach:'Достижения',a1:'Первая сессия',a2:'70+ баллов',a3:'5 сессий',a4:'Без выходов',n1:'Тренируйтесь понемногу каждый день|Десять минут в день лучше одной долгой тренировки.',n2:'Сначала безопасность|Рядом должен быть взрослый, а вокруг платформы — мягкая поверхность.',n3:'Скоро новые уровни|После пилотных испытаний появятся новые игры и уровни.',aiph:'Спросите тренера…',send:'Отправить',aihi:'Привет! Я твой тренер по балансу. Спрашивай про упражнения.',aioff:'Помощник недоступен в этом режиме.',nobt:'Web Bluetooth недоступен. Используйте Chrome на компьютере или Android.',cs:'с',bio:'Система биологической обратной связи',slogan:'Каждый шаг — лучший баланс!',topsub:'Сегодняшняя тренировка ведёт к большому успеху!',choose:'Выберите игру',hint:'Держи в целевой зоне!',blk:'Этот просмотр блокирует Bluetooth. Скачайте файл страницы и откройте его в Chrome.',Lang:'Russian'}};
let lang='kk',live=false,view='home',P={n:'',grp:'adhd'};
try{lang=localStorage.getItem('bb_l')||lang;P=JSON.parse(localStorage.getItem('bb_p'))||P}catch(e){}
const t=k=>(T[lang]&&T[lang][k])||T.en[k]||k;
const S={r:0,p:0,w:0,ww:[],dist:[],t:performance.now(),t0:0,el:0,hold:0,err:0,out:true,run:false,gid:'focus',lv:1,cx:0,cy:0};
const raw={r:0,p:0},off={r:0,p:0};let lastT=0;
const cur=()=>GAMES.find(g=>g.id===S.gid);
const sessions=()=>{try{return JSON.parse(localStorage.getItem('bb_s')||'[]')}catch(e){return[]}};
const fmtD=d=>new Date(d).toLocaleDateString(lang==='kk'?'kk-KZ':lang==='ru'?'ru-RU':'en-GB');

/* ---- sensor ---- */
function onPacket(dv){
 const ax=dv.getInt16(0,true)/1000,ay=dv.getInt16(2,true)/1000,az=dv.getInt16(4,true)/1000;
 const gx=dv.getInt16(6,true)/100,gy=dv.getInt16(8,true)/100,gz=dv.getInt16(10,true)/100;
 const now=performance.now(),first=!lastT,dt=first?.01:Math.min(.1,(now-lastT)/1000);lastT=now;
 const ra=Math.atan2(ay,az)*57.2958,pa=Math.atan2(-ax,Math.hypot(ay,az))*57.2958;
 if(first){raw.r=ra;raw.p=pa}
 raw.r=.98*(raw.r+gx*dt)+.02*ra;raw.p=.98*(raw.p+gy*dt)+.02*pa;
 feed(FLIP_ROLL*(raw.r-off.r),FLIP_PITCH*(raw.p-off.p),Math.hypot(gx,gy,gz));
}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12345a;color:#fff;padding:12px 18px;border-radius:14px;max-width:90vw;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)';document.body.appendChild(d);setTimeout(()=>d.remove(),10000)}
async function connectBLE(){
 if(!navigator.bluetooth){toast(t('nobt')+' '+t('blk'));return}
 try{
  const d=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'BalanceBoard'}],optionalServices:[SVC]});
  d.addEventListener('gattserverdisconnected',()=>{live=false;lastT=0});
  const srv=await d.gatt.connect(),ch=await(await srv.getPrimaryService(SVC)).getCharacteristic(CHR);
  await ch.startNotifications();
  ch.addEventListener('characteristicvaluechanged',e=>onPacket(e.target.value));
  lastT=0;live=true;
 }catch(e){console.error(e);const m=(e&&e.message)||'';if(e&&(e.name==='SecurityError'||/permissions policy|disallowed/i.test(m)))toast(t('blk'));else if(e&&e.name!=='NotFoundError')toast((e.name||'Error')+': '+m)}
}
$('#dv').onclick=connectBLE;
$('#zr').onclick=()=>{off.r=raw.r;off.p=raw.p};
setInterval(()=>{if(live)return;const x=performance.now()/1000;feed(Math.sin(x*1.3)*2.2+Math.sin(x*.4),Math.cos(x*1.1)*2+Math.cos(x*.5),6+Math.abs(Math.sin(x))*4)},50);

/* ---- game + score ---- */
function feed(r,p,w){
 const now=performance.now(),dt=Math.min(.1,(now-S.t)/1000);S.t=now;S.r=r;S.p=p;
 S.ww.push(w);if(S.ww.length>100)S.ww.shift();S.w=S.ww.reduce((a,b)=>a+b,0)/S.ww.length;
 const g=cur(),x=now/1000;S.cx=g.amp*Math.sin(x*g.sp);S.cy=g.amp*Math.cos(x*g.sp*.8);
 const d=Math.hypot(r-S.cx,p-S.cy);S.dist.push(d);if(S.dist.length>(S.run?20000:300))S.dist.shift();
 if(S.run){S.el=(now-S.t0)/1000;if(d<ZONE[S.lv]){S.hold+=dt;S.out=false}else if(!S.out){S.err++;S.out=true}}
}
function calc(){
 const a=S.dist,n=a.length||1,m=a.reduce((x,y)=>x+y,0)/n,sg=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/n);
 const hold=S.run?Math.min(100,S.hold/Math.max(10,S.el)*100):100*a.filter(d=>d<ZONE[S.lv]).length/n;
 return Math.round(.35*Math.max(0,100-sg*12)+.25*Math.max(0,100-S.w*2)+.25*hold+.15*Math.max(0,100-S.err*8));
}
function start(id){
 S.gid=id;S.lv=+$('#lv').value;S.run=true;S.t0=performance.now();S.hold=0;S.err=0;S.out=true;S.el=0;S.dist=[];$('#sn').style.backgroundImage='url('+IMG[GM[id][0]]+')';$('#ch2').src=IMG[GM[id][1]];show('play');
}
$('#pf').onclick=()=>{
 if(!S.run)return;S.run=false;
 try{const a=sessions();a.push({d:Date.now(),g:S.gid,lv:S.lv,sc:calc(),h:+S.hold.toFixed(1),e:S.err,du:Math.round(S.el)});localStorage.setItem('bb_s',JSON.stringify(a.slice(-60)))}catch(e){}
 show('results');
};

/* ---- rendering ---- */
const MH=a=>a.map(([k,l])=>`<div class="m"><span data-i18n="${l}"></span><b data-k="${k}">–</b></div>`).join('');
$('#m1').innerHTML=MH([['ro','roll'],['pi','pitch'],['om','omega']]);
$('#m2').innerHTML=MH([['ro','roll'],['pi','pitch'],['om','omega'],['er','err']]);
const set=(k,v)=>$$('[data-k="'+k+'"]').forEach(e=>e.textContent=v);
function gameCards(id){
 $('#'+id).innerHTML=GAMES.map(g=>`<div class="gc ${g.g}" data-id="${g.id}" style="background-image:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(8,20,55,.8)),url(${IMG[GM[g.id][0]]})"><small>${t(g.g)}</small><h3>${t(g.k)}</h3><b>▶ ${t('play')}</b></div>`).join('');
 $$('#'+id+' .gc').forEach(c=>c.onclick=()=>start(c.dataset.id));
}
function rows(){
 const a=sessions().slice(-3).reverse();
 $('#hl').innerHTML=a.length?a.map(s=>`<div class="row"><span>${t(GAMES.find(g=>g.id===s.g).k)} · ${fmtD(s.d)}</span><b>${s.sc}</b></div>`).join(''):`<p class="mu">${t('empty')}</p>`;
}
function stats(){
 const a=sessions(),sc=a.map(s=>s.sc),best=sc.length?Math.max(...sc):0;
 $('#rs').innerHTML=[['best',best],['avg',sc.length?Math.round(sc.reduce((x,y)=>x+y,0)/sc.length):0],['cnt',a.length]].map(([k,v])=>`<div class="m"><span>${t(k)}</span><b>${v}</b></div>`).join('');
 $('#rb').innerHTML=a.slice(-12).map(s=>`<i style="height:${s.sc}%" title="${s.sc}"></i>`).join('');
 $('#jt').innerHTML=a.length?`<table><tr><th>${t('date')}</th><th>${t('games')}</th><th>${t('lvl')}</th><th>${t('score')}</th><th>${t('hold')}</th><th>${t('err')}</th></tr>${a.slice().reverse().map(s=>`<tr><td>${fmtD(s.d)}</td><td>${t(GAMES.find(g=>g.id===s.g).k)}</td><td>${s.lv}</td><td>${s.sc}</td><td>${s.h} ${t('cs')}</td><td>${s.e}</td></tr>`).join('')}</table>`:`<p class="mu">${t('empty')}</p>`;
 const on=[a.length>=1,best>=70,a.length>=5,a.some(s=>s.e===0)];
 $('#ab').innerHTML=['a1','a2','a3','a4'].map((k,i)=>`<span class="bd ${on[i]?'on':''}">🏅 ${t(k)}</span>`).join('');
}
function render(){
 const s=calc(),mm=Math.floor(S.el/60),ss=Math.floor(S.el%60);
 set('sc',s);$('#rg').style.setProperty('--p',s);
 set('ro',S.r.toFixed(1)+'°');set('pi',S.p.toFixed(1)+'°');set('om',S.w.toFixed(1)+'°/'+t('cs'));set('er',S.err);
 const dv=$('#dv');dv.className='pill '+(live?'live':'demo');dv.textContent=live?'● '+t('live'):'○ '+t('demo');
 if(view==='play'){
  $('#ps').textContent='Balance Score '+s;$('#pt').textContent='⏱ '+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');$('#pk').textContent='⭐ '+Math.floor(S.hold);$('#gt').textContent=t(cur().k);$('#hb').style.width=Math.min(100,S.hold/Math.max(1,S.el)*100)+'%';
  const K=4.5,cl=v=>Math.max(4,Math.min(96,v));
  const tg=$('#tg').style;tg.left=cl(50+S.cx*K)+'%';tg.top=cl(50+S.cy*K)+'%';tg.width=ZONE[S.lv]*2*K+'%';
  const bl=$('#bl').style;bl.left=cl(50+S.r*K)+'%';bl.top=cl(50+S.p*K)+'%';
 }
}
setInterval(render,100);

/* ---- views, language, profile ---- */
function show(v){
 if(v!=='play')S.run=false;view=v;
 $$('main>section').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
 $$('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='results'||v==='journal'||v==='profile')stats();
 if(v==='home')rows();
}
const NAV=[['home','🏠'],['games','🎮'],['results','📊'],['profile','👤'],['journal','📒'],['news','📰'],['ai','🤖']];
$('#nv').innerHTML=NAV.map(([v,i])=>`<button data-v="${v}"><span>${i}</span><span data-i18n="${v}"></span></button>`).join('');
$$('#nv button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function apply(){$$('[data-img]').forEach(e=>e.src=IMG[e.dataset.img]);$('#bn').style.backgroundImage='linear-gradient(90deg,rgba(0,40,90,.4),rgba(0,0,0,0)),url('+IMG.lake+')';
 document.documentElement.lang=lang;
 $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 $$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('#hi').textContent=t('hello').replace('{n}',P.n||t('guest'));
 gameCards('hg');gameCards('gg');rows();stats();
 $('#nw').innerHTML=['n1','n2','n3'].map(k=>{const [a,b]=t(k).split('|');return `<div class="cd"><h2>${a}</h2><p class="mu">${b}</p></div>`}).join('');
 $('#pn').value=P.n;$('#pg').value=P.grp;
}
$('#lg').value=lang;
$('#lg').onchange=e=>{lang=e.target.value;try{localStorage.setItem('bb_l',lang)}catch(x){}apply()};
const saveP=()=>{P.n=$('#pn').value.trim();P.grp=$('#pg').value;try{localStorage.setItem('bb_p',JSON.stringify(P))}catch(e){}$('#hi').textContent=t('hello').replace('{n}',P.n||t('guest'))};
$('#pn').oninput=saveP;$('#pg').onchange=saveP;

/* ---- AI coach (Claude via sample) ---- */
const msg=(c,txt)=>{const d=document.createElement('div');d.className='b '+c;d.textContent=txt;$('#ch').appendChild(d);$('#ch').scrollTop=1e6;return d};
let hist=[];
async function ask(){
 const q=$('#aq').value.trim();if(!q)return;$('#aq').value='';msg('u',q);hist.push('User: '+q);
 const out=msg('a','…');
 try{
  const sample=window.claude&&await window.claude.use('sample');
  if(!sample){out.textContent=t('aioff');return}
  const prompt='You are a friendly balance-training coach inside the BalanceBoard app, used by children with ADHD or cerebral palsy and by their parents and teachers. Reply in '+t('Lang')+', in at most 4 short, simple, encouraging sentences. Give practical tips about the exercises; do not diagnose and, for health concerns, suggest asking a doctor or therapist. Current live data: Balance Score '+calc()+', roll '+S.r.toFixed(1)+' deg, pitch '+S.p.toFixed(1)+' deg.\n\nConversation:\n'+hist.slice(-8).join('\n')+'\nCoach:';
  const r=await sample(prompt,{cache:false,onText:x=>{out.textContent=x.text}});
  out.textContent=r.text;hist.push('Coach: '+r.text);
 }catch(e){out.textContent=t('aioff')}
}
$('#as').onclick=ask;$('#aq').onkeydown=e=>{if(e.key==='Enter')ask()};
msg('a',t('aihi'));
apply();show('home');
</script></body></html>
